<footer>
  <div style="display:flex">
    {% for social in config.extra.social %}
        <a class="soc" href={{ social.url }} title={{ social.name }}>
            {% if social.icon == "scholar" %}
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.242 13.769L0 9.5 12 0l12 9.5-5.242 4.269C17.548 11.249 14.978 9.5 12 9.5c-2.977 0-5.548 1.748-6.758 4.269zM12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/></svg>
            {% else %}
            <i data-feather={{ social.icon }}></i>
            {% endif %}
        </a>
    {% endfor %}
  </div>
  <div class="footer-info">
    {{ now() | date(format="%Y") }} © {{ config.extra.copyright }} | <a
      href="https://github.com/XXXMrG/archie-zola">Archie-Zola Theme</a>
  </div>
</footer>

{% if config.extra.social %}
<script>
    feather.replace();
</script>
{% endif %}
